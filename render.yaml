# Optional Render "Blueprint". You can also create the service by hand (see README).
services:
  - type: web
    name: nyay-ai-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
